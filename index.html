<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ln:#e5e7eb;--activo:#b45309;color-scheme:light}

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:1000px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top{flex-wrap:wrap}
.logo{height:56px;width:auto;display:block}
.lema{width:100%;margin-top:-4px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.volver{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;text-decoration:none;margin:-6px 0 16px}
.volver:hover{border-color:#8b5cf6}
.volver[hidden]{display:none}
.instalar{border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;border-radius:20px;padding:4px 10px;cursor:pointer}
.instalar[hidden]{display:none}
.guia{margin:-6px 0 16px}
.guia-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
.guia-btn:hover,.guia-btn[aria-expanded=true]{border-color:#8b5cf6}
.guia-caja{margin-top:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.guia-caja[hidden]{display:none}
.guia-botones{display:flex;flex-wrap:wrap;gap:8px}
.visor{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.visor[hidden]{display:none}
.visor-barra{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--ln)}
.visor-volver{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer}
.visor-volver:hover{border-color:#8b5cf6}
.visor-volver svg{width:18px;height:18px}
.visor-nombre{margin-left:auto;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visor-marco{flex:1;width:100%;border:0;background:#fff}
body.visor-abierto{overflow:hidden}
.reg-clave{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}

details{margin-top:28px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px}
summary{cursor:pointer;font-weight:600}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;white-space:pre}

.vista[hidden]{display:none}
.vista-tit{font-size:22px;font-weight:800;margin:0 0 12px}
.tarjeta{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.45}

a.reg-b{text-decoration:none;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}

.seg button.on{background:#f59e0b;color:#1c1300}
.avatar{width:44px;height:44px;border-radius:50%;background:#f59e0b;color:#1c1300;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;overflow:hidden}

.abajo{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}

/* Modo incrustado (iframe): solo el panel */
body.embed{background:transparent}body.embed main{padding:8px}
body.embed .top,body.embed .guia,body.embed details,body.embed .pie,body.embed .abajo{display:none}

<script>
const q = new URLSearchParams(location.search);
// Vengo desde una app con el botón de Grow Panel: la apunto y muestro «Volver a …»
if (q.has('desde')) {
  const id = q.get('desde'), nombre = q.get('nombre') || id, url = q.get('url') || '';
  if (/^https:\/\/[^\s"'<>]+$/.test(url)) {
    let apps = {};
    try { apps = JSON.parse(localStorage.getItem('growpanel.apps')) || {}; } catch (e) {}
    apps[id] = Object.assign({}, apps[id], { nombre, url });
    try { localStorage.setItem('growpanel.apps', JSON.stringify(apps)); } catch (e) {}
    const v = document.getElementById('volver');
    v.href = url; v.textContent = '← Volver a ' + nombre; v.hidden = false;
    // Resumen que trae la app detrás de «#ficha=» (no sale del navegador)
    const m = location.hash.match(/^#ficha=(.+)$/);
    if (m) {
      try {
        const f = JSON.parse(decodeURIComponent(m[1]));
        if (f && typeof f === 'object' && !Array.isArray(f)) {
          let fichas = {};
          try { fichas = JSON.parse(localStorage.getItem('growpanel.fichas')) || {}; } catch (e) {}
          fichas[id] = f;
          localStorage.setItem('growpanel.fichas', JSON.stringify(fichas));
          document.querySelector('grow-panel').cargar();
        }
      } catch (e) {}
    }
  }
  ['desde', 'nombre', 'url'].forEach(k => q.delete(k));
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));  // también quita «#ficha=…»
}
if (q.has('embed')) {
  document.body.classList.add('embed');
  const p = document.querySelector('grow-panel');
  p.removeAttribute('titulo');
  for (const k of ['compacto', 'ocultar', 'tema']) if (q.has(k)) p.setAttribute(k, q.get(k));
  p.cargar();
}
document.getElementById('ver').textContent = window.GrowPanel.VERSION;

// «Abre tus apps»: las apps de esta misma dirección se abren debajo de una barra de Grow Panel.
// Las de otra dirección (Amable Meta, Amable Fit…) se abren a pantalla completa: dentro de Grow Panel el
// navegador las aislaría y saldrían sin tus datos. Para volver, su botón de la mini flor.
(() => {
  const panel = document.querySelector('grow-panel');
  const visor = document.getElementById('visor'), marco = document.getElementById('visor-marco');
  // Direcciones de las apps de apps.json: solo a ellas se les pasa la clave del registro diario
  let conocidas = new Set();
  fetch('apps.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(reg => {
    conocidas = new Set((reg.apps || []).filter(a => !a.externa).map(a => { try { return new URL(a.url).origin; } catch (e) { return ''; } }));
  }).catch(() => {});
  const conClave = url => {
    let k = null; try { k = localStorage.getItem('growpanel.clave'); } catch (e) {}
    if (!/^[A-Za-z0-9_-]{32,128}$/.test(k || '')) return url;
    return url + (url.includes('#') ? '&' : '#') + 'gpclave=' + k;
  };
  function cerrar() {
    if (visor.hidden) return;
    visor.hidden = true; document.body.classList.remove('visor-abierto');
    try { marco.contentWindow.location.replace('about:blank'); } catch (err) { marco.src = 'about:blank'; }
    if (window.GrowPanelReenviar) window.GrowPanelReenviar().then(() => panel.cargar()); else panel.cargar();   // por si la app ha actualizado su resumen
  }
  panel.addEventListener('grow-panel-abrir', e => {
    const { url, nombre } = e.detail;
    let destino;
    try { destino = new URL(url); } catch (err) { return; }
    e.preventDefault();
    if (destino.origin !== location.origin) { location.assign(conocidas.has(destino.origin) ? conClave(url) : url); return; }
    document.getElementById('visor-nombre').textContent = nombre;
    marco.title = nombre;
    // replace: así la app no deja pasos en el historial y «Volver» cierra siempre a la primera
    try { marco.contentWindow.location.replace(url); } catch (err) { marco.src = url; }
    visor.hidden = false; document.body.classList.add('visor-abierto');
  });
  document.getElementById('visor-volver').addEventListener('click', cerrar);
})();

// Cuenta Amable = la cuenta de Google de la persona (ver CUENTA-AMABLE.md).
// Usa el proyecto Firebase de Amable Life: como están en la misma dirección, si ya entraste en Amable Life, aquí también.
window.CuentaAmable = (() => {
  const CONFIG = { apiKey: 'AIzaSyBgutkr0jGcono1GZLz6XiC9TSP83ux8lg', authDomain: 'equilibra-6aff8.firebaseapp.com',
    projectId: 'equilibra-6aff8', appId: '1:682128349771:web:9e27263f55cab679ba8bce' };
  const BASE = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const avisos = new Set();
  let usuario = null, listo = null;
  const cargar = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
  function iniciar() {
    if (listo) return listo;
    listo = (async () => {
      if (!window.firebase) { await cargar(BASE + 'firebase-app-compat.js'); await cargar(BASE + 'firebase-auth-compat.js'); }
      if (!firebase.apps.length) firebase.initializeApp(CONFIG);
      firebase.auth().getRedirectResult().catch(() => {});
      await new Promise(ok => {
        let primera = true;
        firebase.auth().onAuthStateChanged(u => {
          const conGoogle = u && u.providerData.some(p => p.providerId === 'google.com');
          usuario = conGoogle ? u : null;
          if (primera) { primera = false; ok(); }
          avisos.forEach(f => f(usuario));
        });
      });
    })().catch(() => {});
    return listo;
  }
  return {
    iniciar,
    usuario: () => usuario,
    alCambiar: f => avisos.add(f),
    async token() { await iniciar(); return usuario ? usuario.getIdToken() : null; },
    async entrar() {
      await iniciar();
      const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await firebase.auth().signInWithPopup(p); }
      catch (e) { if (/popup|cancelled|blocked/i.test(e.code || '')) await firebase.auth().signInWithRedirect(p); else throw e; }
    },
    async salir() { await iniciar(); await firebase.auth().signOut(); }
  };
})();

// Resumen del final del día y Ajustes (cuenta, hora del resumen, tema, instalar, ayuda, tus datos).
// La clave solo vive en este navegador (localStorage «growpanel.clave»); en el servidor solo se guarda su huella.
// Con la Cuenta Amable (Google) todo va a la cuenta: lo mismo en el móvil y en el PC.
(() => {
  const REGISTRO = 'https://registro-diario.proud-hill-016b.workers.dev';
  const CLAVE_OK = /^[A-Za-z0-9_-]{32,128}$/;
  const HORA_OK = /^([01]\d|2[0-3]):[0-5]\d$/;
  const resCaja = document.getElementById('reg-caja'), ajCaja = document.getElementById('aj-caja');
  const vRes = document.getElementById('v-resumen'), vAj = document.getElementById('v-ajustes');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const leerClave = () => { try { const k = localStorage.getItem('growpanel.clave'); return CLAVE_OK.test(k || '') ? k : null; } catch (e) { return null; } };
  const guardarClave = k => { try { localStorage.setItem('growpanel.clave', k); return true; } catch (e) { return false; } };
  const nuevaClave = () => { const b = new Uint8Array(32); crypto.getRandomValues(b); return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const miClave = () => { let k = leerClave(); if (!k) { guardarClave(nuevaClave()); k = leerClave(); } return k; };
  const dia = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const NOMBRES = { pasos: 'pasos', pausas_vista: 'pausas de la vista', minutos_concentracion: 'minutos de concentración',
    tareas_hechas: 'tareas hechas', tareas_total: 'tareas en total', bloques_con_tareas: 'bloques con tareas', bloques_total: 'bloques en total',
    minutos: 'minutos', sesiones: 'sesiones', metas_hechas: 'metas hechas', horas_sueno: 'horas de sueño', ronquidos: 'ronquidos',
    racha: 'días de racha', semana: 'sesiones esta semana', acciones_pendientes: 'acciones pendientes' };
  // Datos que ya son un total o un estado (racha, semana…): en «7 días» se muestra el último valor, no la suma
  const NO_SUMAR = /^(racha|semana|acciones_pendientes|.*_total|areas_.*)$/;
  const nombreDato = k => NOMBRES[k] || k.replace(/_/g, ' ');
  const num = v => Number(v).toLocaleString('es-ES', { maximumFractionDigits: 1 });
  let estado = { modo: '', mostrar: false };
  miClave();   // la clave se crea sola la primera vez (nunca se cambia una que ya existe)

  // Hora del resumen del día: en internet (la misma en el móvil y en el PC) y una copia en este navegador
  const leerHora = () => { try { const h = localStorage.getItem('growpanel.hora_resumen'); return HORA_OK.test(h || '') ? h : '20:00'; } catch (e) { return '20:00'; } };
  const guardarHoraLocal = h => { try { localStorage.setItem('growpanel.hora_resumen', h); } catch (e) {} };
  const leerTema = () => { try { return localStorage.getItem('growpanel.tema') || 'auto'; } catch (e) { return 'auto'; } };

  async function nombresApps() {
    try {
      const reg = await (await fetch('apps.json?t=' + Date.now(), { cache: 'no-store' })).json();
      const m = {}; (reg.apps || []).forEach(a => { if (a.registro) m[a.registro] = a.nombre; }); return m;
    } catch (e) { return {}; }
  }

  // Autorización: la Cuenta Amable (Google) si hay sesión y el servidor la acepta; si no, la clave de este navegador
  async function autorizacion(clave) {
    try { const tk = await window.CuentaAmable.token(); if (tk) return 'Bearer ' + tk; } catch (e) {}
    return 'Bearer ' + clave;
  }
  async function pedir(ruta, opciones = {}) {
    const clave = miClave();
    const hacer = auth => fetch(REGISTRO + ruta, Object.assign({ cache: 'no-store' }, opciones, { headers: Object.assign({ Authorization: auth }, opciones.headers || {}) }));
    let r = await hacer(await autorizacion(clave));
    if (r.status === 401) r = await hacer('Bearer ' + clave);   // servidor aún sin cuentas
    return r;
  }
  // Une la clave de este navegador a la cuenta de Google (una vez por cuenta): lo enviado con la clave pasa a la cuenta
  async function vincular(clave) {
    const u = window.CuentaAmable.usuario(); if (!u) return;
    let hecho = null; try { hecho = localStorage.getItem('growpanel.vinculada'); } catch (e) {}
    if (hecho === u.uid) return;
    try {
      const r = await fetch(`${REGISTRO}/vincular`, { method: 'POST', headers: { Authorization: 'Bearer ' + await u.getIdToken(), 'Content-Type': 'application/json' }, body: JSON.stringify({ clave }) });
      if (r.ok) { try { localStorage.setItem('growpanel.vinculada', u.uid); } catch (e) {} }
    } catch (e) {}
  }

  async function cargarHora() {
    try { const r = await pedir('/ajustes'); if (r.ok) { const j = await r.json(); if (HORA_OK.test(j.hora_resumen || '')) guardarHoraLocal(j.hora_resumen); } } catch (e) {}
    return leerHora();
  }
  async function guardarHora(h) {
    guardarHoraLocal(h);
    try { const r = await pedir('/ajustes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hora_resumen: h }) }); return r.ok; }
    catch (e) { return false; }
  }
  const horaHTML = h => `<div class="tarjeta"><h3>¿A qué hora quieres tu resumen del día?</h3>
    <div class="fila"><input type="time" class="hora-in" value="${esc(h)}" aria-label="Hora del resumen del día">
    <button class="reg-b" data-a="hora">Guardar</button><span class="reg-nota hora-msg" style="margin:0"></span></div>
    <div class="reg-nota" style="margin-bottom:0">A esa hora tus apps Amable mandan sus números del día. Es la misma en el móvil y en el PC. Si alguna app aún no se ha actualizado, manda a las 20:00.</div></div>`;
  // Si la hora guardada en internet es otra, se pone en el campo (si no lo estás tocando)
  const refrescarHora = (caja, antes) => cargarHora().then(h => {
    const inp = caja.querySelector('.hora-in'); if (inp && h !== antes && document.activeElement !== inp) inp.value = h;
  });

  async function resumen() {
    const hoy = new Date(), hace6 = new Date(); hace6.setDate(hoy.getDate() - 6);
    const r = await pedir(`/registro?desde=${dia(hace6)}&hasta=${dia(hoy)}`);
    if (!r.ok) throw new Error(r.status);
    const filas = (await r.json()).filas || [];
    if (!filas.length) return `<div class="reg-aviso">Todavía no hay datos. Abre tus apps desde «Abrir apps»: a partir de las ${esc(leerHora())} sus números aparecerán aquí.</div>`;
    const nombres = await nombresApps(), hoyTxt = dia(hoy), porApp = {};
    filas.forEach(f => {
      const a = porApp[f.app] = porApp[f.app] || {}, d = a[f.dato] = a[f.dato] || { hoy: null, semana: 0 };
      if (f.fecha === hoyTxt) d.hoy = f.valor;
      if (NO_SUMAR.test(f.dato)) d.semana = Number(f.valor) || 0;   // filas ordenadas por fecha: queda el último
      else d.semana += Number(f.valor) || 0;
    });
    return Object.keys(porApp).sort().map(app => `<div class="reg-app"><b>${esc(nombres[app] || app)}</b>
      <table class="reg-tabla"><tr><th>Dato</th><th>Hoy</th><th>7 días</th></tr>${Object.entries(porApp[app]).map(([k, d]) =>
        `<tr><td>${esc(nombreDato(k))}</td><td>${d.hoy === null ? '—' : esc(num(d.hoy))}</td><td>${esc(num(d.semana))}</td></tr>`).join('')}</table></div>`).join('');
  }

  function clavePanel(clave) {
    const vista = estado.mostrar ? clave : clave.slice(0, 6) + '•••••••••••••••' + clave.slice(-4);
    const pegar = estado.modo === 'pegar'
      ? `<div class="reg-clave"><input class="reg-in" id="reg-in" placeholder="Pega aquí tu clave de Grow Panel" autocomplete="off" spellcheck="false"><button class="reg-b" data-a="usar">Usar esta clave</button></div>` : '';
    const olvidar = estado.modo === 'olvidar'
      ? `<div class="reg-acciones"><span>Este navegador olvidará tu clave. Si no la tienes apuntada en otro sitio, no podrás volver a ver tu historial.</span>
         <button class="reg-b peligro" data-a="olvidar-si">Sí, olvidar la clave aquí</button><button class="reg-b" data-a="cancelar">Cancelar</button></div>` : '';
    return `<details class="reg-mas"${['pegar', 'olvidar'].includes(estado.modo) || estado.mostrar ? ' open' : ''}><summary>Sin cuenta de Google: usar en otro aparato o en una app instalada</summary>
      <p class="reg-nota">Solo hace falta si no entras con Google. Copia tu clave de Grow Panel y pégala en el otro aparato o en la app.</p>
      <div class="reg-clave"><code id="reg-clave">${esc(vista)}</code>
      <button class="reg-b" data-a="copiar">Copiar</button><button class="reg-b" data-a="mostrar">${estado.mostrar ? 'Ocultar' : 'Mostrar'}</button></div>
      ${pegar}${olvidar}
      <div class="guia-botones"><button class="reg-b" data-a="pegar">Usar la clave de otro aparato</button>
      <button class="reg-b" data-a="olvidar">Olvidar la clave en este navegador</button></div></details>`;
  }

  function borrarHTML() {
    if (estado.modo === 'borrar') return `<div class="reg-acciones"><span>¿Borrar <b>todos</b> tus datos del registro? No se puede deshacer.</span>
      <button class="reg-b peligro" data-a="borrar-si">Sí, borrar mis datos</button><button class="reg-b" data-a="cancelar">Cancelar</button></div>`;
    return `<div class="reg-acciones"><button class="reg-b peligro" data-a="borrar">Borrar mis datos del registro</button></div>`;
  }

  async function pintarResumen() {
    const clave = miClave();
    await window.CuentaAmable.iniciar();
    await vincular(clave);
    const u = window.CuentaAmable.usuario(), hora = leerHora();
    resCaja.innerHTML = (u ? '' : `<div class="tarjeta fila"><span style="flex:1;min-width:200px">Entra con tu cuenta de Google para ver lo mismo en el móvil y en el PC.</span>
        <button class="reg-b google" data-a="entrar">Entrar con Google</button></div>`)
      + horaHTML(hora)
      + `<div class="tarjeta"><h3>Hoy y los últimos 7 días</h3><div class="reg-nota">Solo números, y solo los ves tú.</div>
        <div class="reg-res"><div class="reg-nota">Cargando…</div></div>
        <div class="reg-acciones"><button class="reg-b" data-a="actualizar">↻ Actualizar</button></div></div>`;
    refrescarHora(resCaja, hora);
    let cuerpo;
    try { cuerpo = await resumen(); } catch (e) { cuerpo = '<div class="reg-aviso">No se pudo leer tu resumen. Revisa la conexión y pulsa ↻ Actualizar.</div>'; }
    const res = resCaja.querySelector('.reg-res'); if (res) res.innerHTML = cuerpo;
  }

  async function pintarAjustes() {
    const clave = miClave();
    await window.CuentaAmable.iniciar();
    await vincular(clave);
    const u = window.CuentaAmable.usuario(), hora = leerHora(), tema = leerTema(), V = window.GrowPanel.VERSION;
    const inicial = ((u && (u.displayName || u.email)) || '?').trim().charAt(0).toUpperCase();
    const cuenta = u
      ? `<div class="tarjeta"><h3>Tu cuenta</h3>
          <div class="fila" style="margin-bottom:8px"><span class="avatar">${u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc(inicial)}</span>
          <span style="flex:1;min-width:0;overflow-wrap:anywhere"><b>${esc(u.displayName || 'Cuenta de Google')}</b><br><span class="reg-nota">${esc(u.email || '')}</span></span></div>
          <div class="reg-nota">Has entrado con Google. Es tu Cuenta Amable: la misma en todas tus apps Amable, en el móvil y en el PC.</div>
          <div class="fila"><button class="reg-b" data-a="cambiar">Cambiar de cuenta</button><button class="reg-b" data-a="salir">Salir de la cuenta</button></div>
          <div class="reg-nota cuenta-msg" style="margin-bottom:0"></div></div>`
      : `<div class="tarjeta"><h3>Tu cuenta</h3>
          <div class="reg-nota">No has entrado. Entra con tu cuenta de Google para ver lo mismo en el móvil y en el PC, y en todas tus apps Amable.</div>
          <button class="reg-b google" data-a="entrar">Entrar con Google</button><div class="reg-nota cuenta-msg" style="margin-bottom:0"></div></div>`;
    const temaH = `<div class="tarjeta"><h3>Tema</h3><div class="seg">${[['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']]
      .map(([v, n]) => `<button type="button" data-a="tema" data-tema="${v}" class="${v === tema ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
    const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const inst = `<div class="tarjeta"><h3>Instalar Grow Panel</h3><div class="reg-nota" style="margin-bottom:${!instalada && window.gpAviso ? '10px' : '0'}">${instalada ? 'Ya la tienes instalada.'
      : window.gpAviso ? 'Ponla en la pantalla de inicio, como una app.' : 'Desde el menú del navegador: «Instalar app» o «Añadir a pantalla de inicio».'}</div>
      ${!instalada && window.gpAviso ? '<button class="reg-b" data-a="instalar">Instalar</button>' : ''}</div>`;
    const sop = `Hola, os escribo por Grow Panel (${V}). Me pasa esto: `;
    const ayuda = `<div class="tarjeta"><h3>Ayuda y soporte</h3><div class="reg-nota">¿Algo no funciona o tienes una duda? Escríbenos y te ayudamos.</div>
      <div class="fila"><a class="reg-b" href="mailto:info@practicaintegral.club?subject=${encodeURIComponent('Grow Panel · Ayuda')}&body=${encodeURIComponent(sop)}">Email</a>
      <a class="reg-b" target="_blank" rel="noopener" href="https://wa.me/34658825799?text=${encodeURIComponent(sop)}">WhatsApp</a></div></div>`;
    const datos = `<div class="tarjeta"><h3>Tus datos</h3><div class="reg-nota">Tus apps solo mandan números (pasos, minutos, tareas…), nunca textos. Solo los ves tú.</div>
      <div class="reg-nota" id="reg-msg"></div>${borrarHTML()}${clavePanel(clave)}</div>`;
    ajCaja.innerHTML = cuenta + horaHTML(hora) + temaH + inst + ayuda + datos
      + `<div class="reg-nota" style="text-align:center">Grow Panel ${esc(V)}</div>`;
    refrescarHora(ajCaja, hora);
  }

  function pintar() {
    if (!vRes.hidden) pintarResumen();
    if (!vAj.hidden) pintarAjustes();
  }

  async function alClic(e) {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const accion = a.dataset.a, caja = e.currentTarget, msg = () => ajCaja.querySelector('#reg-msg');
    if (accion === 'entrar' || accion === 'cambiar') {
      try { await window.CuentaAmable.entrar(); }
      catch (err) { const m = caja.querySelector('.cuenta-msg'); if (m) m.textContent = 'No se pudo entrar con Google. Inténtalo otra vez.'; return; }
    }
    else if (accion === 'salir') { await window.CuentaAmable.salir(); }
    else if (accion === 'hora') {
      const tj = a.closest('.tarjeta'), inp = tj.querySelector('.hora-in'), m = tj.querySelector('.hora-msg');
      if (!HORA_OK.test(inp.value || '')) { m.textContent = 'Elige una hora.'; return; }
      m.textContent = 'Guardando…';
      m.textContent = (await guardarHora(inp.value)) ? '✓ Guardada' : '✓ Guardada en este aparato';
      return;
    }
    else if (accion === 'tema') { try { localStorage.setItem('growpanel.tema', a.dataset.tema); } catch (err) {} window.gpTema(a.dataset.tema); }
    else if (accion === 'instalar') {
      const av = window.gpAviso; if (!av) return;
      av.prompt(); await av.userChoice; window.gpAviso = null; document.getElementById('instalar').hidden = true;
    }
    else if (accion === 'pegar') estado.modo = 'pegar';
    else if (accion === 'usar') {
      const k = (document.getElementById('reg-in').value || '').trim();
      if (!CLAVE_OK.test(k)) { msg().textContent = 'Esa clave no es válida: debe tener entre 32 y 128 letras, números, guiones o guiones bajos.'; return; }
      guardarClave(k); estado = { modo: '', mostrar: false };
    }
    else if (accion === 'copiar') {
      try { await navigator.clipboard.writeText(leerClave()); msg().textContent = '✓ Clave copiada. Pégala en el otro aparato o en la app.'; }
      catch (err) { estado.mostrar = true; await pintarAjustes(); msg().textContent = 'No se pudo copiar sola: mantenla pulsada para seleccionarla y copiarla.'; }
      return;
    }
    else if (accion === 'mostrar') estado.mostrar = !estado.mostrar;
    else if (accion === 'borrar') estado.modo = 'borrar';
    else if (accion === 'olvidar') estado.modo = 'olvidar';
    else if (accion === 'cancelar') estado.modo = '';
    else if (accion === 'borrar-si') {
      let texto;
      try {
        const r = await pedir('/registro', { method: 'DELETE' });
        const j = await r.json();
        texto = r.ok ? `✓ Borrados ${j.borradas || 0} datos del registro.` : 'No se pudo borrar. Inténtalo de nuevo.';
      } catch (err) { texto = 'No se pudo borrar: revisa la conexión.'; }
      estado.modo = ''; await pintarAjustes(); msg().textContent = texto;
      return;
    }
    else if (accion === 'olvidar-si') { try { localStorage.removeItem('growpanel.clave'); } catch (err) {} guardarClave(nuevaClave()); estado = { modo: '', mostrar: false }; }
    pintar();
  }
  resCaja.addEventListener('click', alClic);
  ajCaja.addEventListener('click', alClic);

  // Grow Panel pide los números a las apps: lo que cada app deja en su ficha («datos») lo manda él al registro diario,
  // con tu cuenta o tu clave. Solo de hoy o ayer, solo si ha cambiado y nunca todo a cero (sería una copia vacía de la app
  // en este navegador y borraría los números buenos enviados desde otro aparato).
  const DATO_OK = /^[a-z0-9_]{1,40}$/, FECHA_OK = /^\d{4}-\d{2}-\d{2}$/;
  let reenviando = false;
  async function reenviarFichas() {
    if (reenviando) return; reenviando = true;
    try {
      let fichas = {}, hechas = {};
      try { fichas = JSON.parse(localStorage.getItem('growpanel.fichas')) || {}; } catch (e) {}
      try { hechas = JSON.parse(localStorage.getItem('growpanel.reenviadas')) || {}; } catch (e) {}
      const conDatos = Object.entries(fichas).filter(([, f]) => f && f.datos && typeof f.datos === 'object');
      if (!conDatos.length) return;
      const reg = await (await fetch('apps.json?t=' + Date.now(), { cache: 'no-store' })).json();
      const registroDe = {}; (reg.apps || []).forEach(a => { if (a.registro) registroDe[a.id] = a.registro; });
      const hoy = new Date(), ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
      for (const [id, f] of conDatos) {
        const app = registroDe[id];
        const fecha = FECHA_OK.test(f.fecha || '') ? f.fecha : (f.actualizado ? dia(new Date(f.actualizado)) : '');
        if (!app || (fecha !== dia(hoy) && fecha !== dia(ayer))) continue;
        const datos = Object.fromEntries(Object.entries(f.datos).filter(([k, v]) => DATO_OK.test(k) && typeof v === 'number' && isFinite(v)).slice(0, 20));
        if (!Object.keys(datos).length || Object.values(datos).every(v => v === 0)) continue;
        const firma = fecha + JSON.stringify(datos);
        if (hechas[id] === firma) continue;
        const r = await pedir('/registro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fecha, app, datos }) });
        if (r.ok) { hechas[id] = firma; try { localStorage.setItem('growpanel.reenviadas', JSON.stringify(hechas)); } catch (e) {} }
      }
    } catch (e) {} finally { reenviando = false; }
  }
  window.GrowPanelReenviar = reenviarFichas;
  reenviarFichas();
  // Cuando una app de esta dirección actualiza su ficha en otra pestaña, o al volver a Grow Panel
  addEventListener('storage', e => { if (e.key === 'growpanel.fichas') reenviarFichas(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reenviarFichas(); });

  window.CuentaAmable.alCambiar(() => { pintar(); document.querySelector('grow-panel').cargar(); });
  window.GrowPanelVistas = { pintar: () => { estado.modo = ''; pintar(); } };
  // Para las tarjetas de «Abre tus apps»: números del registro de ayer y hoy (de internet: iguales en todos tus aparatos)
  window.GrowPanelRegistro = async () => {
    await vincular(miClave());
    const hoy = new Date(), ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
    const r = await pedir(`/registro?desde=${dia(ayer)}&hasta=${dia(hoy)}`);
    return r.ok ? ((await r.json()).filas || []) : null;
  };
})();

// Tema: «auto» sigue al sistema; «claro» u «oscuro» lo fuerzan (página, logo y tarjetas)
window.gpTema = t => {
  const html = document.documentElement, src = document.querySelector('.top picture source'), panel = document.querySelector('grow-panel');
  if (t === 'claro') html.dataset.theme = 'light'; else if (t === 'oscuro') html.dataset.theme = 'dark'; else delete html.dataset.theme;
  if (src) src.media = t === 'oscuro' ? 'all' : t === 'claro' ? 'not all' : '(prefers-color-scheme: dark)';
  if (t === 'claro' || t === 'oscuro') panel.setAttribute('tema', t); else panel.removeAttribute('tema');
};
try { const t = localStorage.getItem('growpanel.tema'); if (t === 'claro' || t === 'oscuro') window.gpTema(t); } catch (e) {}

// (La guía «Cómo conectar / Sincronizar tus apps» se quitó en v1.13: las apps se conectan solas al abrirlas desde aquí.)
// Instalable como app (PWA)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let aviso = null;
const bInst = document.getElementById('instalar');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); aviso = window.gpAviso = e; bInst.hidden = false; });
bInst.addEventListener('click', async () => { if (!aviso) return; aviso.prompt(); await aviso.userChoice; aviso = window.gpAviso = null; bInst.hidden = true; });
addEventListener('appinstalled', () => { bInst.hidden = true; });

(() => {
  const VISTAS = ['apps', 'resumen', 'ajustes'], botones = document.querySelectorAll('.abajo button');
  function mostrar() {
    const v = VISTAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'apps';
    VISTAS.forEach(n => { document.getElementById('v-' + n).hidden = n !== v; });
    botones.forEach(b => { if (b.dataset.v === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (v === 'apps') document.querySelector('grow-panel').cargar(); else window.GrowPanelVistas.pintar();
  }
  botones.forEach(b => b.addEventListener('click', () => {
    const h = '#' + b.dataset.v;
    if (location.hash === h || (b.dataset.v === 'apps' && !location.hash)) { mostrar(); window.scrollTo(0, 0); }
    else { location.hash = h; window.scrollTo(0, 0); }
  }));
  addEventListener('hashchange', mostrar);
  mostrar();
})();
</script>
</body>
</html>
