<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grow Panel</title>
<meta name="description" content="Grow Panel: el panel central de tus apps · by Práctica Integral">
<meta name="theme-color" content="#f59e0b">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grow Panel">
<script>/* tema elegido en Ajustes, antes de pintar (sin parpadeo) */
try { const t = localStorage.getItem('growpanel.tema'); if (t === 'claro') document.documentElement.dataset.theme = 'light'; else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ln:#e5e7eb;--activo:#b45309;--fila:#e9ecf1;color-scheme:light}
:root[data-theme=dark]{--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mut:#9aa3b2;--ln:#2a313d;--activo:#fbbf24;--fila:#262d39;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mut:#9aa3b2;--ln:#2a313d;--activo:#fbbf24;--fila:#262d39;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:1000px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top{flex-wrap:wrap}
.logo{height:56px;width:auto;display:block}
.lema{flex:1;min-width:0;margin:0;padding-left:12px;border-left:2px solid var(--ln);font-size:15px;font-weight:600;line-height:1.25}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.volver{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;text-decoration:none;margin:-6px 0 16px}
.volver:hover{border-color:#8b5cf6}
.volver[hidden]{display:none}
.instalar{border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;border-radius:20px;padding:4px 10px;cursor:pointer}
.instalar[hidden]{display:none}
.guia{margin:-6px 0 16px}
.guia-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
.guia-btn:hover,.guia-btn[aria-expanded=true]{border-color:#8b5cf6}
.guia-caja{margin-top:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.guia-caja[hidden]{display:none}
.guia-botones{display:flex;flex-wrap:wrap;gap:8px}
.visor{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.visor[hidden]{display:none}
.visor-barra{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--ln)}
.visor-volver{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:7px 12px;cursor:pointer}
.visor-volver:hover{border-color:#8b5cf6}
.visor-volver svg{width:18px;height:18px}
.visor-nombre{margin-left:auto;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visor-marco{flex:1;width:100%;border:0;background:#fff}
.visor-volver.guia{outline:3px dashed #f59e0b;outline-offset:2px}
.listo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;max-width:calc(100% - 32px);
  background:#16a34a;color:#fff;font-weight:800;font-size:15px;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
body.visor-abierto{overflow:hidden}
.reg-clave{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.reg-clave code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:12.5px}
.reg-b{font-size:13px;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;cursor:pointer}
.reg-b:hover{border-color:#8b5cf6}
.reg-b.peligro{color:#dc2626;border-color:#fca5a5}
.reg-nota{font-size:12.5px;color:var(--mut);margin:4px 0 10px}
.franja-res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px;padding:8px 10px;margin-bottom:12px;border-radius:12px;background:#f59e0b;color:#1c1300}
.franja-res h2{grid-column:2;margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px;text-align:center}
.franja-res .rec{grid-column:3;justify-self:end;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.45);border:1px solid rgba(28,19,0,.25);color:#1c1300;cursor:pointer}
.franja-res .rec:hover{background:rgba(255,255,255,.7)}
.franja-res .rec.girando .ic{display:inline-block;animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
@media (max-width:520px){.franja-res{grid-template-columns:1fr auto}.franja-res h2{grid-column:1;text-align:left;font-size:19px}.franja-res .rec{grid-column:2}}
.sec{margin:0 0 12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:0;font-size:14px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:16px;font-weight:800}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.sec-cuerpo{padding:0 16px 16px}
.reg-b.act{font-size:14px;padding:8px 14px;border-color:#d97706;background:#fde68a;color:#1c1300;font-weight:800}
.reg-b.act.girando .ic{display:inline-block;animation:gira 1s linear infinite}
.seg.periodos{flex-wrap:wrap;margin-bottom:12px}
.seg.periodos button{position:relative}
.seg.periodos button.toca::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#ef4444}
#dia-caja{--fuera:var(--card)}
.diario{position:relative;margin:6px 0 4px;padding:22px 22px 18px;border-radius:4px 0 6px 6px;
  --tx:#3b2a14;--mut:#7a6646;--card:#fffaf0;--bg:#fffdf6;--ln:#e7d49b;color:var(--tx);
  background:linear-gradient(225deg,var(--fuera) 0 26px,transparent 26px),
    repeating-linear-gradient(180deg,transparent 0 31px,rgba(176,140,60,.10) 31px 32px),
    linear-gradient(180deg,#fff6cc 0,#fcefb5 55%,#f8e59c 100%);
  box-shadow:0 1px 2px rgba(90,65,0,.18),0 10px 24px -8px rgba(120,90,0,.35);cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M30%201C21%203%2012%2010%207%2020c3-2%206-3%209-4-2%201-4%203-5%205%206-3%2012-9%2015-14%201-2%203-4%204-6z%22%20fill%3D%22%238a5a2b%22%20stroke%3D%22%233b2410%22%20stroke-width%3D%221.1%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M27%204C20%2010%2013%2017%207%2024%22%20fill%3D%22none%22%20stroke%3D%22%23f3e2b8%22%20stroke-width%3D%22.9%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M8%2023%203%2029%22%20stroke%3D%22%232b1a0b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M3%2029%201.6%2030.6%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") 1 31,text}
.diario::before{content:"";position:absolute;top:0;right:0;width:37px;height:37px;border-bottom-left-radius:5px;
  background:linear-gradient(45deg,#e9d184 0,#f6e7a8 48%,transparent 50%);box-shadow:-2px 3px 4px -1px rgba(90,65,0,.25)}
.diario textarea{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M30%201C21%203%2012%2010%207%2020c3-2%206-3%209-4-2%201-4%203-5%205%206-3%2012-9%2015-14%201-2%203-4%204-6z%22%20fill%3D%22%238a5a2b%22%20stroke%3D%22%233b2410%22%20stroke-width%3D%221.1%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M27%204C20%2010%2013%2017%207%2024%22%20fill%3D%22none%22%20stroke%3D%22%23f3e2b8%22%20stroke-width%3D%22.9%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M8%2023%203%2029%22%20stroke%3D%22%232b1a0b%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M3%2029%201.6%2030.6%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E") 1 31,text;background:rgba(255,253,244,.85)}
.diario .querido{font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;font-size:34px;font-weight:700;color:#5b3a12;line-height:1.1;margin:0 0 8px;transform:rotate(-1.5deg);transform-origin:left}
.diario .preg{margin:18px 0 6px;font-weight:800;font-size:15px}
.diario .preg:first-child,.diario .querido+.preg{margin-top:4px}
.diario .ayuda{font-size:12.5px;color:var(--mut);margin:-2px 0 6px}
.diario .campo{position:relative}
.diario .campo textarea{padding-right:46px}
.diario .mic{position:absolute;right:8px;bottom:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;padding:0}
.diario .mic:hover{color:var(--tx)}
.diario .mic-nota{font-size:13px;color:var(--mut);margin:-2px 4px 10px;line-height:1.35}
.diario .mic-nota.no{color:#b45309;font-weight:600}
.diario .mic.pensando{color:#d97706;border-color:#f59e0b;animation:micGira 1s linear infinite}
@keyframes micGira{50%{opacity:.35}}
.diario .mic.grabando{background:#dc2626;border-color:#dc2626;color:#fff;animation:micLatido 1.2s infinite}
@keyframes micLatido{50%{box-shadow:0 0 0 6px rgba(220,38,38,.25)}}
.diario .preg-fila{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 14px}
.diario .preg2{font-weight:800;font-size:14.5px;margin:0 0 4px}
.diario .dia-num-fila{font-weight:400;font-size:13.5px;line-height:1.7;margin:0 0 8px}
.diario .dia-num b{font-weight:800}
.diario .dia-num .num-act{font-size:12.5px;color:var(--mut);margin:0 6px 0 2px}
.diario .num-rec{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.diario textarea{width:100%;min-height:56px;resize:vertical;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:10px 12px;font:inherit;font-size:14.5px;line-height:1.5}
.diario .opciones{display:flex;flex-wrap:wrap;gap:8px}
.diario .opciones button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.diario .opciones button.on{background:#f59e0b;border-color:#d97706;color:#1c1300;font-weight:800}
.diario .diario-fin{display:flex;justify-content:center;margin:22px 0 6px;padding-top:16px;border-top:1px solid var(--ln)}
.diario .btn-diario-hecho{font-size:15.5px;padding:12px 22px;border-color:#16a34a;color:#15803d}
.diario .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.diario .chips label{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;user-select:none}
.diario .chips input{position:absolute;opacity:0;pointer-events:none}
.diario .chips label:has(input:checked){background:#f59e0b;border-color:#d97706;color:#1c1300;font-weight:800}
.diario .chips label:has(input:focus-visible){outline:2px solid #d97706;outline-offset:2px}
.diario label.marca{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px;cursor:pointer}
.diario label.marca input{width:20px;height:20px;accent-color:#f59e0b}
.diario .paso-cal{margin:8px 0;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.diario .paso-cal b{display:block;font-size:14.5px;margin-bottom:3px}
.diario .paso-cal .ayuda{margin:0}
.diario .cal-botones{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.diario .btn-life,.diario .btn-hecho{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.diario .btn-life{border-color:#d97706;color:#b45309}
.diario .btn-hecho.on{background:#16a34a;border-color:#15803d;color:#fff}
.diario .final{margin-top:18px;padding:14px;border-radius:12px;background:#fef3c7;color:#78350f;font-weight:800;text-align:center}
.ia-cuando{font-size:13.5px;color:var(--mut);line-height:1.55;margin:-4px 0 10px}
.ia-cuando b{color:var(--tx, inherit);font-weight:700}
.ia-caja{background:var(--fila);border-radius:12px;padding:16px 18px;line-height:1.65;font-size:15px;white-space:pre-wrap;min-height:60px;margin-bottom:10px}
.ia-caja b{font-size:16px}
.ia-caja.vacia{color:var(--mut);font-size:14px}
.reg-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:6px}
.reg-app{border:2px solid var(--ac,var(--ln));border-radius:18px;padding:14px 16px;margin:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac,transparent) 10%,var(--card)) 0,var(--card) 70px);
  box-shadow:0 2px 10px color-mix(in srgb,var(--ac,#000) 18%,transparent)}
.reg-app .reg-tabla{width:100%;min-width:0}
.reg-app-cab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.reg-logo{width:38px;height:38px;border-radius:10px;background:var(--c,#1f2937);display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.reg-logo img{width:100%;height:100%;object-fit:cover}
.reg-app-cab b{display:block}
.reg-app-cab[data-a="plegar-app"]{cursor:pointer;user-select:none;border-radius:10px}
.reg-app-cab[data-a="plegar-app"]:focus-visible{outline:2px solid var(--ac,#f59e0b);outline-offset:3px}
.reg-app-cab .asa-datos{margin-left:auto;flex:none;width:28px;height:30px;display:grid;place-items:center;border:0;padding:0;border-radius:6px;background:transparent;color:var(--mut);cursor:grab;touch-action:none}
.reg-app-cab .asa-datos:hover,.reg-app-cab .asa-datos:focus-visible{background:var(--fila);color:var(--tx);outline:none}
.reg-app-cab .asa-datos+.chev{margin-left:0}
.reg-app.arrastrando{opacity:.55;border-style:dashed}
.reg-app-cab .chev{margin-left:auto;flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:transform .2s}
.reg-app-cab:hover .chev{background:var(--fila);color:var(--tx)}
.reg-app.plegada .chev{transform:rotate(-90deg)}
.reg-app.plegada .reg-tabla tr:not(:first-child),.reg-app.plegada .reg-avisos{display:none}
.reg-tabla{width:auto;min-width:min(100%,380px);border-collapse:separate;border-spacing:0 6px;font-size:14px;margin-top:4px}
.reg-tabla th.th-abrir{text-align:left;padding-left:0}
.abrir-app{background:#16a34a;color:#fff;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.abrir-app:hover{background:#15803d}
.reg-sin{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.reg-avisos:empty{display:none}
.reg-avisos{font-size:13.5px;font-weight:600;color:#b45309;margin:2px 0 6px;line-height:1.4}
.reg-tabla th{font-size:13px;font-weight:800;color:var(--tx);text-align:center;padding:0 10px 2px;white-space:nowrap}
.reg-tabla td{background:var(--fila);color:var(--tx);font-weight:400;padding:10px 14px}
.reg-tabla td:first-child{border-radius:10px 0 0 10px;padding-right:24px}
.reg-tabla td:last-child{border-radius:0 10px 10px 0}
.reg-tabla td+td{text-align:center;font-size:15px;font-variant-numeric:tabular-nums;width:1%;white-space:nowrap;padding-left:12px;padding-right:12px}
.reg-aviso{font-size:13px;margin:8px 0;padding:8px;border-radius:8px;background:var(--bg)}
.reg-cuenta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--ln)}
.reg-b.google{background:#f59e0b;border-color:#d97706;color:#1c1300;font-weight:800;padding:8px 14px}
.reg-mas{margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
.reg-mas summary{font-size:13px;color:var(--mut);cursor:pointer}
.reg-acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln);align-items:center}
input.reg-in{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:13px}
.guia-caja ol{margin:6px 0 10px;padding-left:20px}
.guia-fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.guia-fila .n{font-weight:600;min-width:0;flex:1}
.guia-fila .e{font-size:12.5px;color:var(--mut);display:block;font-weight:400}
.guia-fila a{flex:none;font-size:13px;font-weight:600;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;text-decoration:none}
.guia-fila a:hover{border-color:#8b5cf6}
.mut{color:var(--mut);font-size:14px}
.ver{margin-left:auto;font-size:13px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--ln);padding:3px 9px;border-radius:20px}
details{margin-top:28px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px}
summary{cursor:pointer;font-weight:600}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;white-space:pre}
code{font-size:13px}
.pie{text-align:center;margin-top:28px}
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pi-seal,.gp-seal{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--mut);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;text-decoration:none}
.pi-seal::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}
.gp-seal svg{width:14px;height:14px;flex:none}
.gp-seal:hover{color:var(--tx);border-color:#8b5cf6}
.pi-seal:hover{color:var(--tx);border-color:#22c55e}

<script src="grow-panel.js"></script>
<script>
const q = new URLSearchParams(location.search);
// Vengo desde una app con el botón de Grow Panel: la apunto y muestro «Volver a …»
if (q.has('desde')) {
  const id = q.get('desde'), nombre = q.get('nombre') || id, url = q.get('url') || '';
  if (/^https:\/\/[^\s"'<>]+$/.test(url)) {
    let apps = {};
    try { apps = JSON.parse(localStorage.getItem('growpanel.apps')) || {}; } catch (e) {}
    apps[id] = Object.assign({}, apps[id], { nombre, url });
    try { localStorage.setItem('growpanel.apps', JSON.stringify(apps)); } catch (e) {}
    const v = document.getElementById('volver');
    v.href = url; v.textContent = '← Volver a ' + nombre; v.hidden = false;
    if (q.get('unida') === '1') setTimeout(() => window.gpListo && window.gpListo(nombre), 300);
    // Resumen que trae la app detrás de «#ficha=» (no sale del navegador)
    const m = location.hash.match(/^#ficha=(.+)$/);
    if (m) {
      try {
        const f = JSON.parse(decodeURIComponent(m[1]));
        if (f && typeof f === 'object' && !Array.isArray(f)) {
          let fichas = {};
          try { fichas = JSON.parse(localStorage.getItem('growpanel.fichas')) || {}; } catch (e) {}
          fichas[id] = f;
          localStorage.setItem('growpanel.fichas', JSON.stringify(fichas));
          document.querySelector('grow-panel').cargar();
        }
      } catch (e) {}
    }
  }
  ['desde', 'nombre', 'url', 'unida'].forEach(k => q.delete(k));
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));  // también quita «#ficha=…»
}
if (q.has('embed')) {
  document.body.classList.add('embed');
  const p = document.querySelector('grow-panel');
  p.removeAttribute('titulo');
  for (const k of ['compacto', 'ocultar', 'tema']) if (q.has(k)) p.setAttribute(k, q.get(k));
  p.cargar();
}
document.getElementById('ver').textContent = window.GrowPanel.VERSION;

// «Listo, ya está sincronizado con …» (al volver de conectar una app)
window.gpListo = nombre => {
  const d = document.createElement('div'); d.className = 'listo'; d.setAttribute('role', 'status');
  d.textContent = '✓ Listo, ya está sincronizado con ' + nombre;
  document.body.appendChild(d); setTimeout(() => d.remove(), 6000);
  document.querySelector('grow-panel').cargar();
};

// «Abre tus apps»: las apps de esta misma dirección se abren debajo de una barra de Grow Panel.
// Las de otra dirección (Amable Meta, Amable Fit…) se abren a pantalla completa: dentro de Grow Panel el
// navegador las aislaría y saldrían sin tus datos. Para volver, su botón de la mini flor.
(() => {
  const panel = document.querySelector('grow-panel');
  const visor = document.getElementById('visor'), marco = document.getElementById('visor-marco');
  // Direcciones de las apps de apps.json: solo a ellas se les pasa la clave del registro diario
  let conocidas = new Set();
  fetch('apps.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(reg => {
    conocidas = new Set((reg.apps || []).filter(a => !a.externa).map(a => { try { return new URL(a.url).origin; } catch (e) { return ''; } }));
  }).catch(() => {});
  const conClave = (url, codigo) => {
    let k = null; try { k = localStorage.getItem('growpanel.clave'); } catch (e) {}
    const partes = [];
    // Código de un solo uso (15 min): la app se une sola a tu cuenta (grow-panel-boton.js → POST /vincular-app)
    if (codigo) partes.push('gpcodigo=' + codigo);
    if (/^[A-Za-z0-9_-]{32,128}$/.test(k || '')) partes.push('gpclave=' + k);
    // El Gmail con el que has entrado en Grow Panel: la app te dice con qué cuenta de Google entrar (va detrás de «#»: no sale a internet)
    const u = window.CuentaAmable && window.CuentaAmable.usuario();
    if (u && u.email) partes.push('gpcorreo=' + encodeURIComponent(u.email));
    return partes.length ? url + (url.includes('#') ? '&' : '#') + partes.join('&') : url;
  };
  let unidaEnVisor = null;
  // La app abierta debajo de Grow Panel avisa cuando se ha unido
  addEventListener('message', ev => {
    if (ev.origin !== location.origin || !ev.data || ev.data.growpanel !== 'unida') return;
    unidaEnVisor = ev.data.nombre || 'la app';
    const b = document.getElementById('visor-volver'); b.classList.add('guia');
    b.lastChild.textContent = '✓ Conectada · 👉 Clica aquí para volver';
  });
  function cerrar() {
    if (visor.hidden) return;
    const b = document.getElementById('visor-volver'); b.classList.remove('guia'); b.lastChild.textContent = '← Volver a Grow Panel';
    if (unidaEnVisor) { const n = unidaEnVisor; unidaEnVisor = null; setTimeout(() => window.gpListo(n), 200); }
    visor.hidden = true; document.body.classList.remove('visor-abierto');
    try { marco.contentWindow.location.replace('about:blank'); } catch (err) { marco.src = 'about:blank'; }
    if (window.GrowPanelReenviar) window.GrowPanelReenviar().then(() => panel.cargar()); else panel.cargar();   // por si la app ha actualizado su resumen
  }
  // Pide el código de unión (como mucho 2,5 s; si no llega, la app se abre igual)
  const codigoUnion = () => window.GrowPanelCodigo
    ? Promise.race([window.GrowPanelCodigo().catch(() => null), new Promise(ok => setTimeout(() => ok(null), 2500))]) : Promise.resolve(null);
  panel.addEventListener('grow-panel-abrir', async e => {
    const { url, nombre } = e.detail;
    let destino;
    try { destino = new URL(url); } catch (err) { return; }
    e.preventDefault();
    const nuestra = destino.origin === location.origin || conocidas.has(destino.origin);
    const codigo = nuestra ? await codigoUnion() : null;
    if (destino.origin !== location.origin) { location.assign(nuestra ? conClave(url, codigo) : url); return; }
    document.getElementById('visor-nombre').textContent = nombre;
    marco.title = nombre;
    const dentro = codigo ? url + (url.includes('#') ? '&' : '#') + 'gpcodigo=' + codigo : url;
    // replace: así la app no deja pasos en el historial y «Volver» cierra siempre a la primera
    try { marco.contentWindow.location.replace(dentro); } catch (err) { marco.src = dentro; }
    visor.hidden = false; document.body.classList.add('visor-abierto');
  });
  document.getElementById('visor-volver').addEventListener('click', cerrar);
})();

// Cuenta Amable = la cuenta de Google de la persona (ver CUENTA-AMABLE.md).
// Usa el proyecto Firebase de Amable Life: como están en la misma dirección, si ya entraste en Amable Life, aquí también.
window.CuentaAmable = (() => {
  const CONFIG = { apiKey: 'AIzaSyBgutkr0jGcono1GZLz6XiC9TSP83ux8lg', authDomain: 'equilibra-6aff8.firebaseapp.com',
    projectId: 'equilibra-6aff8', appId: '1:682128349771:web:9e27263f55cab679ba8bce' };
  const BASE = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const avisos = new Set();
  let usuario = null, listo = null;
  const cargar = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
  function iniciar() {
    if (listo) return listo;
    listo = (async () => {
      if (!window.firebase) { await cargar(BASE + 'firebase-app-compat.js'); await cargar(BASE + 'firebase-auth-compat.js'); }
      if (!firebase.apps.length) firebase.initializeApp(CONFIG);
      firebase.auth().getRedirectResult().catch(() => {});
      await new Promise(ok => {
        let primera = true;
        firebase.auth().onAuthStateChanged(u => {
          const conGoogle = u && u.providerData.some(p => p.providerId === 'google.com');
          usuario = conGoogle ? u : null;
          // Para las apps de esta misma dirección: con qué Gmail has entrado en Grow Panel (GrowPanel.correo())
          try { if (usuario && usuario.email) localStorage.setItem('growpanel.correo', usuario.email); else localStorage.removeItem('growpanel.correo'); } catch (e) {}
          if (primera) { primera = false; ok(); }
          avisos.forEach(f => f(usuario));
        });
      });
    })().catch(() => {});

      if (b.dataset.x === 'luego' && !prueba) guardarLS('growpanel.alarma_luego', String(Date.now() + 10 * 60000));
      if (b.dataset.x === 'escribir') { location.hash = '#diario'; setTimeout(() => { const s = document.querySelector('[data-sec="d-hoy"]'); if (s) s.open = true; }, 600); }
    });
    // Si Grow Panel está detrás de otras ventanas: aviso del sistema (al tocarlo, Grow Panel se pone delante)
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(r => r.showNotification('📓 Es hora de tu diario de 5 minutos', {
        body: 'Toca para escribirlo. Después Grow Panel te escribe el resumen del día.', icon: 'icono-192.png', badge: 'icono-192.png',
        tag: 'diario', renotify: true, requireInteraction: true, vibrate: [400, 200, 400, 200, 400], data: { url: './#alarma-diario' } })).catch(() => {});
    }
  }
  window.GrowPanelAlarma = mostrarAlarma;
  let revisando = false;
  async function revisarAlarma() {
    if (revisando) return; revisando = true;
    try {
      const c = leerAuto(), ahora = new Date(), hoy = dia(ahora);
      if (!c.auto || !c.recordar || !alarmaAqui()) return;
      const luego = Number(leerLS('growpanel.alarma_luego')) || 0;
      if (luego && Date.now() >= luego) { guardarLS('growpanel.alarma_luego', null); mostrarAlarma(false); return; }
      if (luego || leerLS('growpanel.alarma_dia') === hoy || !c.dias.includes(String(ahora.getDay()))) return;
      const [h, m] = c.hora.split(':').map(Number), obj = h * 60 + m, min = ahora.getHours() * 60 + ahora.getMinutes();
      if (min < obj - c.recordar || min >= obj) return;
      guardarLS('growpanel.alarma_dia', hoy);
      // Si ya has escrito el diario de hoy, no suena
      try { const r = await pedir('/diario?fecha=' + hoy); const j = r.ok ? await r.json() : {}; const d = j.respuestas || {}; if (diarioHecho(d)) return; } catch (e) {}
      mostrarAlarma(false);
    } finally { revisando = false; }
  }
  setInterval(revisarAlarma, 20000);
  setTimeout(revisarAlarma, 5000);

  // Lista de «otros Gmail» de la persona
  async function pintarAlias() {
    const caja = ajCaja.querySelector('.alias-lista'); if (!caja) return;
    try {
      const r = await pedir('/alias'); const j = r.ok ? await r.json() : { alias: [] };
      const lista = j.alias || [];
      caja.innerHTML = lista.length
        ? lista.map(a => `<div class="fila" style="gap:6px;margin:4px 0"><span>✓ ${esc(a.correo || 'Gmail')}</span><button class="reg-b" data-a="alias-quitar" data-correo="${esc(a.correo || '')}">Quitar</button></div>`).join('')
        : 'Ninguno por ahora.';
    } catch (e) { caja.textContent = 'No se pudo leer la lista. Revisa la conexión.'; }
  }

  function pintar() {
    if (!vApps.hidden) pintarDatos();
    if (!vRes.hidden) pintarResumen();
    if (!vDia.hidden) pintarDiarioVista();
    if (!vAj.hidden) pintarAjustes();
  }

  async function alClic(e) {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const accion = a.dataset.a, caja = e.currentTarget, msg = () => ajCaja.querySelector('#reg-msg');
    if (accion === 'abrir-app') { abrirApp(a.dataset.id); return; }
    if (accion === 'plegar-app') { plegarApps(a.closest('.reg-app')); return; }
    if (accion === 'mover-app') return;   // los 6 puntitos: se arrastran (no pliegan)
    if (accion === 'actualizar' && caja === datosCaja) { const p = panelApps(); if (p) p.cargar(); }
    if (accion === 'entrar' || accion === 'cambiar') {
      try { await window.CuentaAmable.entrar(); }
      catch (err) { const m = caja.querySelector('.cuenta-msg'); if (m) m.textContent = 'No se pudo entrar con Google. Inténtalo otra vez.'; return; }
    }
    else if (accion === 'salir') { await window.CuentaAmable.salir(); }
    else if (accion === 'ia-periodo') {
      iaPeriodo = a.dataset.p; pararLectura();
      caja.querySelectorAll('[data-a="ia-periodo"]').forEach(x => x.classList.toggle('on', x === a));
      cargarTextoIA(); return;
    }
    else if (accion === 'ia-generar') { generarTextoIA(); return; }
    else if (accion === 'dia-num') { cargarNumerosDiario(true); return; }
    else if (accion === 'diario-hecho') {
      leerFormDiario();
      diarioDatos.hecho = diarioDatos.hecho ? undefined : true;
      pintarDiario(); guardarDiarioLuego(); return;
    }
    else if (accion === 'diario-planificado') {
      leerFormDiario();
      diarioDatos.planificado = diarioDatos.planificado ? undefined : true;
      pintarDiario(); guardarDiarioLuego(); return;
    }
    else if (accion === 'diario-dia') {
      diarioDia = a.dataset.d;
      pintarSegDiario();
      cargarDiario(); return;
    }
    else if (accion === 'dia-editar') {
      diarioDia = a.dataset.f;
      pintarSegDiario(); cargarDiario();
      const sec = diaCaja.querySelector('[data-sec="d-hoy"]'); if (sec) { sec.open = true; sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    else if (accion === 'dia-mas') { a.disabled = true; a.textContent = 'Cargando…'; cargarListaDiario(true); return; }
    else if (accion === 'dia-periodo') {
      dPeriodo = a.dataset.p; pararDiarioLectura();
      caja.querySelectorAll('[data-a="dia-periodo"]').forEach(x => x.classList.toggle('on', x === a));
      cargarDiarioIA(); return;
    }
    else if (accion === 'dia-generar') { generarDiarioIA(); return; }
    else if (accion === 'dia-leer') { leerDiarioIA(); return; }
    else if (accion === 'diario-animo' || accion === 'diario-alineado') {
      leerFormDiario();
      const k = accion === 'diario-animo' ? 'animo' : 'alineado', v = k === 'animo' ? Number(a.dataset.v) : a.dataset.v;
      diarioDatos[k] = diarioDatos[k] === v ? undefined : v;
      pintarDiario(); guardarDiarioLuego(); return;
    }
    else if (accion === 'ia-leer') { leerTextoIA(); return; }
    else if (accion === 'probar-alarma') { mostrarAlarma(true); return; }
    else if (accion === 'auto-dia') {
      const c = leerAuto(), d = a.dataset.d;
      const dias = c.dias.includes(d) ? c.dias.replace(d, '') : [...c.dias + d].sort().join('');
      guardarAuto({ dias }); return;
    }
    else if (accion === 'probar-aviso') {
      const m = caja.querySelector('.aviso-msg');
      if (!(await suscripcion())) { if (m) m.textContent = 'Primero activa «Avisarme también con Grow Panel cerrado» en este aparato.'; return; }
      if (m) m.textContent = 'Enviando…';
      try {
        const r = await pedir('/push/probar', { method: 'POST' }); const j = await r.json();
        const est = (j.resultados || []).map(x => x.estado || x.error);
        if (m) m.textContent = est.some(x => x === 201 || x === 200) ? '✓ Enviado: en unos segundos te llega el aviso a todos tus aparatos con el aviso activado. Puedes cerrar Grow Panel para verlo.' : 'No se pudo enviar (' + est.join(', ') + ').';
      } catch (err) { if (m) m.textContent = 'No se pudo enviar: revisa la conexión.'; }
      return;
    }
    else if (accion === 'alias-anadir' || accion === 'alias-quitar') {
      const m = caja.querySelector('.cuenta-msg');
      try {
        if (accion === 'alias-anadir') {
          const otro = await window.CuentaAmable.otroGmail();
          if (m) m.textContent = 'Añadiendo ' + otro.email + '…';
          const r = await pedir('/alias', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: otro.token }) });
          const j = await r.json().catch(() => ({}));
          if (m) m.textContent = r.ok ? `✓ ${otro.email} añadido: lo que tus apps manden con ese Gmail ya sale aquí.` : (j.error || 'No se pudo añadir.');
        } else {
          const r = await pedir('/alias', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ correo: a.dataset.correo }) });
          if (m) m.textContent = r.ok ? '✓ Quitado.' : 'No se pudo quitar.';
        }
      } catch (err) { if (m) m.textContent = 'No se pudo: ' + (/popup-closed|cancelled/.test(err && err.code || '') ? 'se cerró la ventana de Google.' : 'inténtalo otra vez.'); }
      await pintarAlias(); document.querySelector('grow-panel').cargar();
      return;
    }
    else if (accion === 'hora') {
      const tj = a.closest('.tarjeta'), inp = tj.querySelector('.hora-in'), m = tj.querySelector('.hora-msg');
      if (!HORA_OK.test(inp.value || '')) { m.textContent = 'Elige una hora.'; return; }
      m.textContent = 'Guardando…';
      m.textContent = (await guardarHora(inp.value)) ? '✓ Guardada' : '✓ Guardada en este aparato';
      return;
    }
    else if (accion === 'tema') { try { localStorage.setItem('growpanel.tema', a.dataset.tema); } catch (err) {} window.gpTema(a.dataset.tema); }
    else if (accion === 'instalar') {
      const av = window.gpAviso; if (!av) return;
      av.prompt(); await av.userChoice; window.gpAviso = null; document.getElementById('instalar').hidden = true;
    }
    else if (accion === 'pegar') estado.modo = 'pegar';
    else if (accion === 'usar') {
      const k = (document.getElementById('reg-in').value || '').trim();
      if (!CLAVE_OK.test(k)) { msg().textContent = 'Esa clave no es válida: debe tener entre 32 y 128 letras, números, guiones o guiones bajos.'; return; }
      guardarClave(k); estado = { modo: '', mostrar: false };
    }
    else if (accion === 'copiar') {
      try { await navigator.clipboard.writeText(leerClave()); msg().textContent = '✓ Clave copiada. Pégala en el otro aparato o en la app.'; }
      catch (err) { estado.mostrar = true; await pintarAjustes(); msg().textContent = 'No se pudo copiar sola: mantenla pulsada para seleccionarla y copiarla.'; }
      return;
    }
    else if (accion === 'mostrar') estado.mostrar = !estado.mostrar;
    else if (accion === 'borrar') estado.modo = 'borrar';
    else if (accion === 'olvidar') estado.modo = 'olvidar';
    else if (accion === 'cancelar') estado.modo = '';
    else if (accion === 'borrar-si') {
      let texto;
      try {
        const r = await pedir('/registro', { method: 'DELETE' });
        const j = await r.json();
        texto = r.ok ? `✓ Borrados ${j.borradas || 0} datos del registro.` : 'No se pudo borrar. Inténtalo de nuevo.';
      } catch (err) { texto = 'No se pudo borrar: revisa la conexión.'; }
      estado.modo = ''; await pintarAjustes(); msg().textContent = texto;
      return;
    }
    else if (accion === 'olvidar-si') { try { localStorage.removeItem('growpanel.clave'); } catch (err) {} guardarClave(nuevaClave()); estado = { modo: '', mostrar: false }; }
    pintar();
  }
  resCaja.addEventListener('click', alClic);
  datosCaja.addEventListener('click', alClic);
  diaCaja.addEventListener('click', alClic);
  ajCaja.addEventListener('click', alClic);
  ajCaja.addEventListener('change', async e => {
    if (e.target.id === 'aviso-push') {
      const m = ajCaja.querySelector('.aviso-msg'), on = e.target.checked;
      try {
        if (on) { await activarAviso(); if (m) m.textContent = '✓ Activado en este aparato: te avisará aunque Grow Panel esté cerrado.'; }
        else { await apagarAviso(); if (m) m.textContent = 'Apagado en este aparato.'; }
      } catch (err) { e.target.checked = !on; if (m) m.textContent = err.message || 'No se pudo.'; }
      return;
    }
    if (e.target.id === 'auto-on') { guardarAuto({ auto: e.target.checked }); return; }
    if (e.target.id === 'auto-hora') { if (HORA_OK.test(e.target.value || '')) guardarAuto({ hora: e.target.value }); return; }
    if (e.target.id === 'auto-recordar') { guardarAuto({ recordar: Number(e.target.value) }); return; }
    if (e.target.id === 'alarma-aqui') { guardarLS('growpanel.alarma_aqui', e.target.checked ? '1' : '0'); const m = ajCaja.querySelector('.auto-msg'); if (m) m.textContent = '✓ Guardado en este aparato'; return; }
    if (e.target.id !== 'compartir') return;
    const on = e.target.checked, nota = ajCaja.querySelector('.compartir-nota'), msg = ajCaja.querySelector('#reg-msg');
    guardarCompartirLocal(on); if (nota) nota.textContent = textoCompartir(on);
    let ok = false;
    try { const r = await pedir('/ajustes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ compartir: on }) }); ok = r.ok; } catch (err) {}
    if (msg) msg.textContent = ok ? '✓ Guardado para todas tus apps y aparatos' : 'No se pudo guardar: revisa la conexión e inténtalo otra vez.';
    if (!ok) { e.target.checked = !on; guardarCompartirLocal(!on); if (nota) nota.textContent = textoCompartir(!on); }
  });

  // Grow Panel pide los números a las apps: lo que cada app deja en su ficha («datos») lo manda él al registro diario,
  // con tu cuenta o tu clave. Solo de hoy o ayer, solo si ha cambiado y nunca todo a cero (sería una copia vacía de la app
  // en este navegador y borraría los números buenos enviados desde otro aparato).
  const DATO_OK = /^[a-z0-9_]{1,40}$/, FECHA_OK = /^\d{4}-\d{2}-\d{2}$/;
  let reenviando = false;
  async function reenviarFichas() {
    if (reenviando || !leerCompartir()) return; reenviando = true;
    try {
      let fichas = {}, hechas = {};
      try { fichas = JSON.parse(localStorage.getItem('growpanel.fichas')) || {}; } catch (e) {}
      try { hechas = JSON.parse(localStorage.getItem('growpanel.reenviadas')) || {}; } catch (e) {}
      const conDatos = Object.entries(fichas).filter(([, f]) => f && f.datos && typeof f.datos === 'object');
      if (!conDatos.length) return;
      const reg = await (await fetch('apps.json?t=' + Date.now(), { cache: 'no-store' })).json();
      const registroDe = {}; (reg.apps || []).forEach(a => { if (a.registro) registroDe[a.id] = a.registro; });
      const hoy = new Date(), ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
      for (const [id, f] of conDatos) {
        const app = registroDe[id];
        const fecha = FECHA_OK.test(f.fecha || '') ? f.fecha : (f.actualizado ? dia(new Date(f.actualizado)) : '');
        if (!app || (fecha !== dia(hoy) && fecha !== dia(ayer))) continue;
        const datos = Object.fromEntries(Object.entries(f.datos).filter(([k, v]) => DATO_OK.test(k) && typeof v === 'number' && isFinite(v)).slice(0, 20));
        if (!Object.keys(datos).length || Object.values(datos).every(v => v === 0)) continue;
        const firma = fecha + JSON.stringify(datos);
        if (hechas[id] === firma) continue;
        const r = await pedir('/registro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fecha, app, datos }) });
        if (r.ok) { hechas[id] = firma; try { localStorage.setItem('growpanel.reenviadas', JSON.stringify(hechas)); } catch (e) {} }
      }
    } catch (e) {} finally { reenviando = false; }
  }
  window.GrowPanelReenviar = reenviarFichas;
  reenviarFichas();
  // Cuando una app de esta dirección actualiza su ficha en otra pestaña, o al volver a Grow Panel
  addEventListener('storage', e => { if (e.key === 'growpanel.fichas') reenviarFichas(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reenviarFichas(); });

  // «Abre tus apps»: sin cuenta de Google no se ven los números de las apps de otros aparatos → aviso para entrar
  const aviso = document.getElementById('aviso-cuenta');
  // Se oculta si Grow Panel ha entrado con Google o si la clave de este navegador ya está unida a tu cuenta
  const pintarAviso = () => { aviso.hidden = !!window.CuentaAmable.usuario(); };
  window.CuentaAmable.iniciar().then(pintarAviso);
  document.getElementById('aviso-entrar').addEventListener('click', () => window.CuentaAmable.entrar().catch(() => {}));
  window.CuentaAmable.alCambiar(() => { pintarAviso(); pintar(); document.querySelector('grow-panel').cargar(); });
  window.GrowPanelVistas = { pintar: () => { estado.modo = ''; pintar(); } };
  // Para las tarjetas de «Abre tus apps»: números del registro de ayer y hoy (de internet: iguales en todos tus aparatos)
  window.GrowPanelRegistro = async () => {
    await vincular(miClave());
    await reenviarFichas();
    const hoy = new Date(), ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
    const r = await pedir(`/registro?desde=${dia(ayer)}&hasta=${dia(hoy)}`);
    if (!r.ok) return null;
    const j = await r.json(), filas = j.filas || [];
    filas.cuentas = j.cuentas || [];   // con qué cuenta envía cada app
    window.gpConCuenta = /^google/.test(j.cuenta || '');   // Google, o una clave ya unida a Google
    pintarAviso();
    const u = window.CuentaAmable && window.CuentaAmable.usuario();
    filas.miCuenta = u ? (u.email || '') : '';
    return filas;
  };
})();

// Tema: «auto» sigue al sistema; «claro» u «oscuro» lo fuerzan (página, logo y tarjetas)
window.gpTema = t => {
  const html = document.documentElement, src = document.querySelector('.top picture source'), panel = document.querySelector('grow-panel');
  if (t === 'claro') html.dataset.theme = 'light'; else if (t === 'oscuro') html.dataset.theme = 'dark'; else delete html.dataset.theme;
  if (src) src.media = t === 'oscuro' ? 'all' : t === 'claro' ? 'not all' : '(prefers-color-scheme: dark)';
  if (t === 'claro' || t === 'oscuro') panel.setAttribute('tema', t); else panel.removeAttribute('tema');
};
try { const t = localStorage.getItem('growpanel.tema'); if (t === 'claro' || t === 'oscuro') window.gpTema(t); } catch (e) {}

// (La guía «Cómo conectar / Sincronizar tus apps» se quitó en v1.13: las apps se conectan solas al abrirlas desde aquí.)
// Instalable como app (PWA)
// Autoactualización (receta de Amable Sleep, 9-11-2026): aunque Grow Panel se quede abierto por detrás,
// al volver a él mira si hay versión nueva y se recarga sola con un aviso. Nunca en mitad de algo ni en bucle.
const gpEstaOcupado = () => {
  if (window.gpOcupado && window.gpOcupado()) return true;
  const a = document.activeElement;   // escribiendo en un hueco de texto
  return !!(a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio' && a.value);
};
let gpRecargando = false;
function gpRecargar(v) {
  if (gpRecargando) return;
  gpRecargando = true;
  if (v) { try { sessionStorage.setItem('growpanel-recarga', v); } catch (e) {} }   // una sola vez por versión
  const t = document.createElement('div');
  t.className = 'toast-version'; t.textContent = v ? `🔄 Actualizando a la ${v}…` : '🔄 Actualizando…';
  document.body.appendChild(t);
  setTimeout(() => location.reload(), 900);
}
let gpUltMira = 0;
async function gpMiraVersion() {
  if (Date.now() - gpUltMira < 60e3 || location.protocol !== 'https:') return;   // como mucho una vez por minuto
  gpUltMira = Date.now();
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
    // Primero version.txt (unos pocos bytes); si no está, grow-panel.js, donde vive VERSION
    let v = '';
    try { const r = await fetch('./version.txt?v=' + Date.now(), { cache: 'no-store' }); if (r.ok) v = (await r.text()).trim(); } catch (e) {}
    if (!/^v[\d.]+$/.test(v)) {
      const txt = await (await fetch('./grow-panel.js?v=' + Date.now(), { cache: 'no-store' })).text();
      v = (txt.match(/const VERSION = '([^']+)'/) || [])[1];
    }
    let ya = false; try { ya = sessionStorage.getItem('growpanel-recarga') === v; } catch (e) {}
    if (v && v !== window.GrowPanel.VERSION && !ya && !gpEstaOcupado()) gpRecargar(v);
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') gpMiraVersion(); });
if ('serviceWorker' in navigator) {
  // Cuando el service worker nuevo toma el control, se recarga una vez (salvo si estás en mitad de algo)
  const habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habia && !gpEstaOcupado()) gpRecargar(''); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
let aviso = null;
const bInst = document.getElementById('instalar');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); aviso = window.gpAviso = e; bInst.hidden = false; });
bInst.addEventListener('click', async () => { if (!aviso) return; aviso.prompt(); await aviso.userChoice; aviso = window.gpAviso = null; bInst.hidden = true; });
addEventListener('appinstalled', () => { bInst.hidden = true; });

(() => {
  const VISTAS = ['apps', 'diario', 'resumen', 'ajustes'], botones = document.querySelectorAll('.abajo button');
  function mostrar() {
    if (location.hash === '#alarma-diario') { history.replaceState(null, '', '#diario'); setTimeout(() => window.GrowPanelAlarma && window.GrowPanelAlarma(false), 300); }
    const v = VISTAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'apps';
    VISTAS.forEach(n => { document.getElementById('v-' + n).hidden = n !== v; });
    botones.forEach(b => { if (b.dataset.v === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (v === 'apps') document.querySelector('grow-panel').cargar();
    window.GrowPanelVistas.pintar();
  }
  botones.forEach(b => b.addEventListener('click', () => {
    const h = '#' + b.dataset.v;
    if (location.hash === h || (b.dataset.v === 'apps' && !location.hash)) { mostrar(); window.scrollTo(0, 0); }
    else { location.hash = h; window.scrollTo(0, 0); }
  }));
  addEventListener('hashchange', mostrar);
  mostrar();
})();
